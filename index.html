<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBot Operacional — SB Marketing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
#app{display:flex;flex-direction:column;height:680px;width:100%;max-width:680px;background:#fff;border:1px solid #e5e5e3;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
#header{padding:14px 18px;border-bottom:1px solid #e5e5e3;display:flex;align-items:center;gap:10px}
#avatar{width:34px;height:34px;border-radius:50%;background:#534AB7;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
#header-info{flex:1}
#header-title{font-size:14px;font-weight:600;color:#1a1a1a}
#header-sub{font-size:12px;color:#888}
#status-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;transition:background .3s}
#status-dot.online{background:#1D9E75}
#token-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:14px}
#token-screen h2{font-size:16px;font-weight:600;color:#1a1a1a}
#token-screen p{font-size:13px;color:#666;text-align:center;line-height:1.6;max-width:320px}
#token-input-wrap{display:flex;gap:8px;width:100%;max-width:360px}
#token-field{flex:1;height:38px;border-radius:8px;border:1px solid #ddd;background:#f9f9f8;padding:0 12px;font-size:13px;font-family:monospace;color:#1a1a1a;outline:none}
#token-field:focus{border-color:#534AB7}
#token-btn{height:38px;padding:0 18px;border-radius:8px;border:1px solid #534AB7;background:#534AB7;font-size:13px;font-weight:500;cursor:pointer;color:#fff}
#token-btn:hover{background:#3C3489}
#token-btn:disabled{opacity:.6;cursor:not-allowed}
#token-error{font-size:12px;color:#c0392b;display:none}
#token-hint{font-size:11px;color:#aaa;text-align:center}
#chat-area{flex:1;display:none;flex-direction:column;overflow:hidden}
#toolbar{padding:8px 14px;border-bottom:1px solid #e5e5e3;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.quick-btn{height:26px;padding:0 10px;border-radius:6px;border:1px solid #e5e5e3;background:transparent;font-size:12px;cursor:pointer;color:#555;white-space:nowrap}
.quick-btn:hover{background:#f5f5f3;color:#1a1a1a}
#logout-btn{margin-left:auto;height:26px;padding:0 10px;border-radius:6px;border:1px solid #e5e5e3;background:transparent;font-size:12px;cursor:pointer;color:#aaa}
#logout-btn:hover{color:#c0392b;border-color:#c0392b}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.bubble{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.6;color:#1a1a1a}
.msg.bot .bubble{background:#f5f5f3;border:1px solid #e5e5e3;border-radius:4px 14px 14px 14px}
.msg.user .bubble{background:#534AB7;color:#fff;border-radius:14px 4px 14px 14px}
.msg-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:2px}
.bot-av{background:#EEEDFE;color:#534AB7}
.user-av{background:#E6F1FB;color:#185FA5}
.thinking{display:flex;gap:4px;align-items:center;padding:10px 13px}
.dot{width:6px;height:6px;border-radius:50%;background:#bbb;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
#input-area{padding:12px 16px;border-top:1px solid #e5e5e3;display:flex;gap:8px;align-items:center}
#msg-input{flex:1;height:38px;border-radius:8px;border:1px solid #ddd;background:#f9f9f8;padding:0 12px;font-size:13px;color:#1a1a1a;outline:none}
#msg-input:focus{border-color:#534AB7}
#send-btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid #534AB7;background:#534AB7;font-size:13px;font-weight:500;cursor:pointer;color:#fff}
#send-btn:hover{background:#3C3489}
.section-title{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px}
.metric-row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.up{color:#0F6E56;font-weight:500}
.down{color:#c0392b;font-weight:500}
.neutral{color:#888}
hr.divider{border:none;border-top:1px solid #e5e5e3;margin:10px 0}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="avatar">SB</div>
    <div id="header-info">
      <div id="header-title">SBot Operacional</div>
      <div id="header-sub">Insights semanais · Reportei + IA</div>
    </div>
    <div id="status-dot"></div>
  </div>
  <div id="token-screen">
    <h2>Conectar ao Reportei</h2>
    <p>Cole o token de API da SB Marketing abaixo. Ele fica salvo só nessa sessão do navegador.</p>
    <div id="token-input-wrap">
      <input id="token-field" type="password" placeholder="Cole o token aqui..." onkeydown="if(event.key==='Enter')connectToken()">
      <button id="token-btn" onclick="connectToken()">Conectar</button>
    </div>
    <span id="token-error">Token inválido. Verifique e tente novamente.</span>
    <p id="token-hint">Onde achar: app.reportei.com → menu → API Reportei</p>
  </div>
  <div id="chat-area">
    <div id="toolbar">
      <button class="quick-btn" onclick="dispatchMsg('insights Adega Point semana passada')">Adega Point</button>
      <button class="quick-btn" onclick="dispatchMsg('insights Pizza Mais semana passada')">Pizza Mais</button>
      <button class="quick-btn" onclick="dispatchMsg('insights Humm Sorvetes semana passada')">Humm Sorvetes</button>
      <button class="quick-btn" onclick="dispatchMsg('insights TechChef semana passada')">TechChef</button>
      <button class="quick-btn" onclick="dispatchMsg('insights Rosenberger semana passada')">Rosenberger</button>
      <button class="quick-btn" onclick="dispatchMsg('insights Parque Capivari semana passada')">Parque Capivari</button>
      <button class="quick-btn" onclick="dispatchMsg('insights Saneares semana passada')">Saneares</button>
      <button class="quick-btn" onclick="dispatchMsg('resumo squad Ruptura')">Ruptura</button>
      <button class="quick-btn" onclick="dispatchMsg('resumo squad Ignição')">Ignição</button>
      <button class="quick-btn" onclick="dispatchMsg('resumo squad Avalanche')">Avalanche</button>
      <button id="logout-btn" onclick="logout()">Sair</button>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input id="msg-input" placeholder="Ex: insights Rosenberger semana passada..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button id="send-btn" onclick="sendMsg()">Enviar</button>
    </div>
  </div>
</div>
<script>
let SESSION_TOKEN = sessionStorage.getItem('sb_reportei_token') || null;
if(SESSION_TOKEN) initChat();

async function connectToken(){
  const val = document.getElementById('token-field').value.trim();
  if(!val) return;
  const btn = document.getElementById('token-btn');
  btn.textContent = 'Verificando...';
  btn.disabled = true;
  document.getElementById('token-error').style.display = 'none';
  try{
    const r = await fetch('/api/reportei?path='+encodeURIComponent('/companies/settings'),{headers:{'Authorization':'Bearer '+val}});
    if(!r.ok) throw new Error('invalid');
    const data = await r.json();
    SESSION_TOKEN = val;
    sessionStorage.setItem('sb_reportei_token', val);
    initChat(data.company);
  }catch(e){
    document.getElementById('token-error').style.display = 'block';
    btn.textContent = 'Conectar';
    btn.disabled = false;
  }
}

function initChat(company){
  document.getElementById('token-screen').style.display = 'none';
  document.getElementById('chat-area').style.display = 'flex';
  document.getElementById('status-dot').classList.add('online');
  if(company){
    addMsg('bot','Conectado como <strong>'+company.name+'</strong> — '+company.total_clients+' clientes.<br><br>Me diga qual cliente ou squad quer analisar, ou use os atalhos acima.');
  } else {
    addMsg('bot','Reconectado! Me diga qual cliente quer analisar.');
  }
}

function logout(){
  SESSION_TOKEN = null;
  sessionStorage.removeItem('sb_reportei_token');
  document.getElementById('chat-area').style.display = 'none';
  document.getElementById('token-screen').style.display = 'flex';
  document.getElementById('status-dot').classList.remove('online');
  document.getElementById('token-btn').textContent = 'Conectar';
  document.getElementById('token-btn').disabled = false;
  document.getElementById('messages').innerHTML = '';
}

function dispatchMsg(text){ addMsg('user', text); }

function sendMsg(){
  const inp = document.getElementById('msg-input');
  const txt = inp.value.trim();
  if(!txt) return;
  inp.value = '';
  addMsg('user', txt);
}

function addMsg(role, text){
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg '+role;
  const av = document.createElement('div');
  av.className = 'msg-av '+(role==='bot'?'bot-av':'user-av');
  av.textContent = role==='bot'?'SB':'vc';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = text;
  div.appendChild(av);
  div.appendChild(bubble);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  if(role==='user') processMsg(text);
}

function showThinking(){
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'thinking-msg';
  div.innerHTML = '<div class="msg-av bot-av">SB</div><div class="bubble thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function removeThinking(){
  const t = document.getElementById('thinking-msg');
  if(t) t.remove();
}

function getDates(){
  const today = new Date();
  const dow = today.getDay();
  const diffMon = dow===0?6:dow-1;
  const mon = new Date(today); mon.setDate(today.getDate()-diffMon-7);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const compMon = new Date(mon); compMon.setDate(mon.getDate()-7);
  const compSun = new Date(sun); compSun.setDate(sun.getDate()-7);
  const fmt = d => d.toISOString().split('T')[0];
  return {start:fmt(mon), end:fmt(sun), compStart:fmt(compMon), compEnd:fmt(compSun)};
}

async function fetchR(path, opts={}){
  try{
    const url = '/api/reportei?path='+encodeURIComponent(path);
    const r = await fetch(url,{headers:{'Authorization':'Bearer '+SESSION_TOKEN,'Content-Type':'application/json'},...opts});
    if(!r.ok) return null;
    return r.json();
  }catch(e){return null}
}

async function findProject(name){
  const data = await fetchR('/projects?q='+encodeURIComponent(name)+'&per_page=20');
  if(!data||!data.data||!data.data.length) return null;
  const n = name.toLowerCase();
  return data.data.find(p=>p.name.toLowerCase().includes(n))||data.data[0];
}

async function getIntegrations(pid){
  const data = await fetchR('/integrations?project_id='+pid+'&per_page=100');
  return data?data.data:[];
}

async function getMetricsList(slug){
  const data = await fetchR('/metrics?integration_slug='+slug+'&per_page=100');
  return data?data.data:[];
}

async function getMetricData(iid, metrics, start, end, compStart, compEnd){
  const body = {start, end, integration_id:iid, metrics};
  if(compStart) { body.comparison_start = compStart; body.comparison_end = compEnd; }
  const data = await fetchR('/metrics/get-data',{method:'POST',body:JSON.stringify(body)});
  return data?data.data:null;
}

function pickMetrics(all){
  const prio=['spend','impressions','reach','clicks','ctr','cpc','conversions','cost_per_conversion','followers','engagement','engagement_rate','page_views','sessions','users'];
  const result=[];
  for(const key of prio){
    const found=all.find(m=>m.metrics&&m.metrics.includes(key));
    if(found&&result.length<8) result.push(found);
  }
  return result.length?result:all.slice(0,6);
}

function fmt(val){
  if(val===undefined||val===null) return '-';
  const n=parseFloat(val);
  if(isNaN(n)) return '-';
  if(Math.abs(n)>=1000000) return (n/1000000).toFixed(1)+'M';
  if(Math.abs(n)>=1000) return (n/1000).toFixed(1)+'k';
  if(Math.abs(n)<10) return n.toFixed(2);
  return Math.round(n).toLocaleString('pt-BR');
}

function fmtDiff(d){
  if(d===undefined||d===null) return '';
  const n=parseFloat(d);
  if(isNaN(n)) return '';
  const v=(n*100).toFixed(1);
  return n>0?'+'+v+'%':v+'%';
}

function labelForKey(key){
  if(!key) return '-';
  const map={spend:'Investimento',impressions:'Impressões',reach:'Alcance',clicks:'Cliques',ctr:'CTR',cpc:'CPC',conversions:'Conversões',cost_per_conversion:'Custo/conv.',followers:'Seguidores',engagement:'Engajamento',engagement_rate:'Taxa eng.',page_views:'Visualizações',sessions:'Sessões',users:'Usuários'};
  const k=key.replace(/^[^:]+:/,'');
  return map[k]||k;
}

function buildMetricsHTML(integrations, metricsData, metricsMeta){
  let html='';
  for(const integ of integrations){
    const mdata=metricsData[integ.id];
    if(!mdata) continue;
    let rows='';
    for(const [id,val] of Object.entries(mdata)){
      if(!val||val.values===undefined||val.values===null) continue;
      const n=parseFloat(val.values);
      if(isNaN(n)) continue;
      const diff=val.comparison?val.comparison.difference:0;
      const cls=diff>2?'up':diff<-2?'down':'neutral';
      const lbl=metricsMeta[id]?labelForKey(metricsMeta[id]):labelForKey(id);
      const diffStr=val.comparison?fmtDiff(val.comparison.difference/100):'';
      rows+='<div class="metric-row"><span>'+lbl+'</span><span class="'+cls+'">'+fmt(n)+(diffStr?' <small>'+diffStr+'</small>':'')+'</span></div>';
    }
    if(rows) html+='<div class="section-title">'+integ.name+'</div>'+rows;
  }
  return html;
}

async function buildAIInsight(clientName, integrations, metricsData, metricsMeta, start, end){
  try{
    const r = await fetch('/api/reportei', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer '+SESSION_TOKEN,
        'Content-Type': 'application/json',
        'x-action': 'generate-insight'
      },
      body: JSON.stringify({clientName, integrations, metricsData, metricsMeta, start, end})
    });
    if(!r.ok) return null;
    const d = await r.json();
    return d.insight || null;
  }catch(e){return null}
}

const squadMap={
  'ruptura':['Adega Point','Humm Sorvetes','Patrón','Pizza Mais','Restaurante Pagé','São Benedito Crepes','Tempero de Família'],
  'ignição':['Alemão Madeiras','Colégio SFA','La Casa Planejados','Monteiro Contabilidade','Run Box Brasil','Saneares','TechChef'],
  'avalanche':['Arraia do GAMT','Parque Capivari','Rosenberger','Total Tintas']
};

async function processMsg(text){
  const t=text.toLowerCase();
  showThinking();

  let squadKey=null;
  if(t.includes('ruptura')) squadKey='ruptura';
  else if(t.includes('ignição')||t.includes('ignicao')) squadKey='ignição';
  else if(t.includes('avalanche')) squadKey='avalanche';

  if(squadKey){
    removeThinking();
    const clients=squadMap[squadKey];
    addMsg('bot','Squad <strong>'+squadKey.charAt(0).toUpperCase()+squadKey.slice(1)+'</strong> — '+clients.length+' clientes.<br><br>'+clients.join(', ')+'<br><br>Qual quer analisar primeiro?');
    return;
  }

  let clientName=text.replace(/insights?/gi,'').replace(/semana passada/gi,'').replace(/essa semana/gi,'').replace(/como foi/gi,'').replace(/resumo/gi,'').replace(/^(o|a|do|da|de)\s+/i,'').trim();
  if(!clientName){ removeThinking(); addMsg('bot','Qual cliente quer analisar?'); return; }

  const project=await findProject(clientName);
  if(!project){ removeThinking(); addMsg('bot','Não encontrei "<strong>'+clientName+'</strong>" no Reportei.'); return; }

  const integrations=await getIntegrations(project.id);
  if(!integrations.length){ removeThinking(); addMsg('bot','Projeto <strong>'+project.name+'</strong> sem integrações ativas.'); return; }

  const {start,end,compStart,compEnd}=getDates();
  const metricsData={}, metricsMeta={};
  for(const integ of integrations.slice(0,3)){
    const allMetrics=await getMetricsList(integ.slug);
    if(!allMetrics.length) continue;
    const selected=pickMetrics(allMetrics);
    const data=await getMetricData(integ.id,selected,start,end,compStart,compEnd);
    if(data){
      metricsData[integ.id]=data;
      selected.forEach(m=>{ if(m.id) metricsMeta[m.id]=m.reference_key||m.id; });
    }
  }

  const metricsHTML=buildMetricsHTML(integrations,metricsData,metricsMeta);
  const aiInsight=await buildAIInsight(project.name,integrations,metricsData,metricsMeta,start,end);

  removeThinking();

  let html='<strong>'+project.name+'</strong><br><small style="color:#888">'+start+' a '+end+'</small>';
  if(metricsHTML) html+='<br><br>'+metricsHTML;
  if(aiInsight) html+='<hr class="divider"><div class="section-title">Análise SBot</div>'+aiInsight.replace(/\n/g,'<br>');
  if(!metricsHTML&&!aiInsight) html+='<br><br>Não encontrei dados para esse período.';

  addMsg('bot',html);
}
</script>
</body>
</html>
