<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBot — SB Marketing</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --black2: #111111;
  --black3: #1a1a1a;
  --yellow: #F5E642;
  --yellow2: #e6d800;
  --white: #f0f0ee;
  --gray: #888880;
  --gray2: #2a2a28;
  --border: rgba(245,230,66,.10);
  --border2: rgba(245,230,66,.22);
  --font: 'Space Grotesk', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--black);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
#app {
  width: 100%;
  max-width: 720px;
  height: 92vh;
  max-height: 820px;
  background: var(--black2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
#app::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--yellow), transparent);
  border-radius: 20px 20px 0 0;
}
#header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  flex-shrink: 0;
}
#logo-img { height: 26px; width: auto; display: block; }
#header-divider {
  width: 1px; height: 20px;
  background: var(--border2);
  flex-shrink: 0;
}
#header-label {
  font-size: 12px; color: var(--gray);
  font-family: var(--mono);
  letter-spacing: .02em;
}
#header-right { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gray); font-family: var(--mono); }
#status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade8066; }
#upload-area { padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#upload-label {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border: 1px dashed var(--border2);
  border-radius: 10px; cursor: pointer;
  font-size: 12px; color: var(--gray);
  transition: all .2s;
}
#upload-label:hover { border-color: var(--yellow); color: var(--yellow); background: rgba(245,230,66,.03); }
#upload-txt { flex: 1; }
#pdf-badge {
  display: none; align-items: center; gap: 6px;
  background: rgba(245,230,66,.08);
  border: 1px solid var(--border2);
  border-radius: 6px; padding: 3px 10px;
  font-size: 11px; font-family: var(--mono); color: var(--yellow);
}
#pdf-input { display: none; }
#toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#gen-btn {
  height: 40px; padding: 0 24px;
  background: var(--yellow); border: none; border-radius: 10px;
  font-size: 13px; font-weight: 700; font-family: var(--font);
  color: var(--black); cursor: pointer;
  transition: all .15s;
  display: inline-flex; align-items: center; gap: 8px;
  letter-spacing: -.01em;
}
#gen-btn:hover { background: var(--yellow2); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(245,230,66,.2); }
#gen-btn:active { transform: translateY(0); box-shadow: none; }
#messages {
  flex: 1; overflow-y: auto; padding: 20px 16px;
  display: flex; flex-direction: column; gap: 16px;
  scrollbar-width: thin; scrollbar-color: var(--gray2) transparent;
}
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.user { flex-direction: row-reverse; }
.av {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
  overflow: hidden;
}
.av.bot { background: var(--yellow); padding: 0; border: 2px solid var(--yellow); }
.av.bot img { width: 28px; height: 28px; object-fit: cover; border-radius: 50%; }
.av.user { background: var(--black3); border: 1px solid var(--border2); color: var(--yellow); font-family: var(--mono); font-size: 9px; letter-spacing: -.02em; }
.bubble {
  max-width: 82%; padding: 11px 14px;
  font-size: 13px; line-height: 1.65; border-radius: 14px;
}
.msg.bot .bubble { background: var(--black3); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; color: var(--white); }
.msg.user .bubble { background: var(--yellow); color: var(--black); border-radius: 14px 4px 14px 14px; font-weight: 500; }
.thinking { display: flex; gap: 5px; align-items: center; padding: 12px 14px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--yellow); animation: pulse 1.4s infinite; }
.dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,60%,100%{opacity:.3;transform:scale(1)}30%{opacity:1;transform:scale(1.3)}}
#input-area {
  padding: 12px 16px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
}
#msg-input {
  flex: 1; min-height: 40px; max-height: 120px;
  background: var(--black3); border: 1px solid var(--border2);
  border-radius: 10px; padding: 10px 14px;
  font-size: 13px; font-family: var(--font);
  color: var(--white); outline: none; resize: none; line-height: 1.5;
}
#msg-input:focus { border-color: var(--yellow); }
#msg-input::placeholder { color: var(--gray); }
#send-btn {
  width: 40px; height: 40px;
  background: var(--black3); border: 1px solid var(--border2);
  border-radius: 10px; color: var(--yellow);
  cursor: pointer; flex-shrink: 0; transition: all .15s;
  display: flex; align-items: center; justify-content: center;
}
#send-btn:hover { background: var(--yellow); color: var(--black); border-color: var(--yellow); }
.insight-card {
  background: var(--black); border: 1px solid var(--border2);
  border-radius: 14px; padding: 18px; margin-top: 4px;
  border-left: 3px solid var(--yellow);
}
.ic-header {
  font-size: 10px; font-family: var(--mono);
  color: var(--yellow); margin-bottom: 14px;
  text-transform: uppercase; letter-spacing: .1em;
  display: flex; align-items: center; gap: 6px;
}
.ic-body { font-size: 13px; line-height: 1.8; color: var(--white); }
.ic-body strong { color: var(--yellow); font-weight: 600; }
.copy-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 14px; padding: 8px 14px;
  background: transparent; border: 1px solid var(--border2);
  border-radius: 8px; font-size: 11px; font-family: var(--mono);
  color: var(--gray); cursor: pointer; transition: all .15s;
}
.copy-btn:hover { border-color: var(--yellow); color: var(--yellow); }
</style>
</head>

let pdfBase64 = sessionStorage.getItem('sb_pdf_b64') || null;
let pdfName = sessionStorage.getItem('sb_pdf_name') || null;
let history = [];

window.onload = () => {
  if(pdfName) showPdfBadge(pdfName);
  addMsg('bot', 'Olá! Sou o <strong>SBot</strong>, seu analista de marketing digital da SB Marketing.<br><br>Suba o PDF do relatório semanal do Reportei e clique em <strong>Gerar insights</strong> para começar.');
};

function handlePDF(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pdfBase64 = e.target.result.split(',')[1];
    pdfName = file.name;
    history = [];
    sessionStorage.setItem('sb_pdf_b64', pdfBase64);
    sessionStorage.setItem('sb_pdf_name', pdfName);
    showPdfBadge(pdfName);
    addMsg('bot','PDF <strong>'+file.name+'</strong> carregado. Clique em <strong>Gerar insights</strong> ou faça uma pergunta sobre o relatório.');
  };
  reader.readAsDataURL(file);
}

function showPdfBadge(name){
  document.getElementById('upload-txt').style.display = 'none';
  document.getElementById('pdf-badge').style.display = 'flex';
  document.getElementById('pdf-name-txt').textContent = name.length > 32 ? name.substring(0,30)+'...' : name;
}

function dispatchMsg(text){ addMsg('user', text); }

function sendMsg(){
  const inp = document.getElementById('msg-input');
  const txt = inp.value.trim();
  if(!txt) return;
  inp.value = ''; inp.style.height = '40px';
  addMsg('user', txt);
}

function makeAv(role){
  const av = document.createElement('div');
  av.className = 'av '+role;
  if(role==='bot'){
    const img = document.createElement('img');
    img.src = AVATAR; img.alt = 'SBot';
    av.appendChild(img);
  } else {
    av.textContent = 'SB';
  }
  return av;
}

function addMsg(role, text){
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg '+role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = text;
  div.appendChild(makeAv(role));
  div.appendChild(bubble);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  if(role==='user') processMsg(text);
}

function addMsgRaw(role, html){
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg '+role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;
  div.appendChild(makeAv(role));
  div.appendChild(bubble);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function showThinking(){
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'thinking-msg';
  const bubble = document.createElement('div');
  bubble.className = 'bubble thinking';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  div.appendChild(makeAv('bot'));
  div.appendChild(bubble);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function removeThinking(){
  const t = document.getElementById('thinking-msg');
  if(t) t.remove();
}

async function processMsg(text){
  if(!pdfBase64){
    showThinking();
    setTimeout(()=>{ removeThinking(); addMsg('bot','Primeiro suba o PDF do relatório usando o campo acima.'); }, 400);
    return;
  }
  showThinking();

  const systemPrompt = `Você é o SBot, analista sênior de marketing digital da SB Marketing — agência com squads nichados de alta performance. A SB tem uma cultura forte, direta e descolada — o bordão interno é "Quebra Tudo", que representa a mentalidade de superar resultados e ir além do esperado.

MISSÃO: Analisar relatórios do Reportei e transformar dados em insights que o cliente entenda com facilidade e que mostrem que a SB domina o que faz.

LINGUAGEM E TOM:
- Didático e acessível: explique o que cada métrica significa quando relevante, como se o cliente não soubesse (ex: "O alcance — quantidade de pessoas únicas que viram o conteúdo — cresceu 23%")
- Profissional e próximo ao mesmo tempo: como um especialista que fala de forma humana, não robótica
- Direto: sem rodeios, sem enrolação
- Confiante: mostre domínio técnico com clareza, não com jargão
- Evite: "extraordinário", "explosão", "incrível", "espetacular", "impressionante"
- Use quando fizer sentido: expressões que mostram que a agência está atenta e engajada. O cliente deve sentir que tem um time dedicado analisando os dados dele
- Cite sempre números reais do relatório

QUANDO GERAR INSIGHTS COMPLETOS:

📊 *Panorama da semana*
[2-3 linhas sobre o desempenho geral com números reais. Compare com o período anterior de forma clara. Ex: "O alcance total foi de X pessoas, uma queda de Y% em relação à semana anterior — movimento que acompanharemos de perto para ajustar a estratégia."]

🏆 *Destaque da semana*
[Identifique o conteúdo com melhor performance — cite o tema ou título do post/Reel. Diga o número (alcance, visualizações) e explique em linguagem simples por que você acredita que performou bem. Ex: "O Reel sobre X atingiu 22 mil pessoas — o melhor resultado do período. Conteúdos que entram em tendências do momento costumam ter esse tipo de distribuição orgânica pelo algoritmo."]

📈 *O que está funcionando*
• [métrica positiva com número, variação e explicação simples do que isso significa na prática]
• [outro ponto positivo com contexto]

⚠️ *Ponto de atenção*
• [métrica ou comportamento que precisa de cuidado — seja específico. Explique o impacto prático para o cliente entender por que isso importa]

💡 *Recomendação para a próxima semana*
[1 ação concreta e específica baseada nos dados. Não seja genérico. Mostre que a recomendação vem dos dados do relatório.]

---
QUANDO GERAR TEXTO PARA WHATSAPP:
- Tom informal e amigável, como uma conversa entre o gestor de conta e o cliente
- Sem formatação markdown, sem emojis em excesso (máximo 2-3 ao longo do texto)
- Estrutura: abertura positiva com dado real → destaque da semana → 1 ponto de atenção → recomendação → fechamento próximo
- Máximo 5 parágrafos curtos
- Escreva na primeira pessoa do plural (nós, a gente) como se fosse o time da SB falando

PARA OUTRAS PERGUNTAS: responda de forma direta e técnica, sempre baseado nos dados do PDF. Se o cliente perguntar algo que não está no relatório, diga claramente.`;

  try{
    const messages = [];
    if(history.length === 0){
      messages.push({role:'user', content:[
        {type:'document', source:{type:'base64', media_type:'application/pdf', data:pdfBase64}},
        {type:'text', text}
      ]});
    } else {
      messages.push({role:'user', content:[
        {type:'document', source:{type:'base64', media_type:'application/pdf', data:pdfBase64}},
        {type:'text', text: history[0].content}
      ]});
      for(let i=1; i<history.length; i++) messages.push(history[i]);
      messages.push({role:'user', content: text});
    }

    history.push({role:'user', content: text});

    const r = await fetch('/api/reportei', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-action':'claude-chat'
      },
      body: JSON.stringify({system: systemPrompt, messages})
    });
    const d = await r.json();
    const reply = d.content && d.content[0] ? d.content[0].text : 'Não consegui processar. Tente novamente.';
    history.push({role:'assistant', content: reply});

    removeThinking();

    const isInsight = /insight|anali|relatório|relatorio|destaque|semana/i.test(text);
    const isWhatsapp = /whatsapp|mensagem pra|mensagem para/i.test(text);

    let html = reply
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>')
      .replace(/\n/g,'<br>');

    if(isInsight || isWhatsapp){
      addMsgRaw('bot',`<div class="insight-card">
        <div class="ic-header">
          <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          ${isWhatsapp ? 'texto para whatsapp' : 'análise sbot'}
        </div>
        <div class="ic-body">${html}</div>
        <button class="copy-btn" onclick="copyInsight(this)">
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          copiar
        </button>
      </div>`);
    } else {
      addMsgRaw('bot', html);
    }
  }catch(e){
    removeThinking();
    addMsg('bot','Erro ao processar o relatório. Tente novamente.');
  }
}

function copyInsight(btn){
  const body = btn.closest('.insight-card').querySelector('.ic-body');
  navigator.clipboard.writeText(body.innerText).then(()=>{
    btn.innerHTML = '✓ copiado!';
